<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雀魂牌谱本地复盘系统</title>
<!-- majiang-ui 资源（阶段一就位，阶段四联调回放） -->
<link rel="stylesheet" href="/static/majiang-ui/dist/css/majiang.css">
<style>
    :root {
        --bg: #1c2333;
        --panel: #262f47;
        --border: #3a4564;
        --text: #e8ecf5;
        --muted: #8b94ad;
        --accent: #5b8cff;
        --ok: #3ecf8e;
        --err: #ff6b6b;
        --warn: #ffb454;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }
    header {
        padding: 18px 28px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 14px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header .badge {
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 10px;
    }
    main { max-width: 1080px; margin: 32px auto; padding: 0 24px; }
    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 22px 24px;
        margin-bottom: 20px;
    }
    .card h2 {
        margin: 0 0 14px;
        font-size: 16px;
        color: var(--muted);
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }
    #btn-toggle-events { padding: 5px 14px; font-size: 12px; }
    #events-scroll { display: none; max-height: 420px; overflow-y: auto; border-radius: 8px; }
    /* 覆盖 majiang-ui 默认的 #board 隐藏，并让回放桌在页面中居中显示 */
    #board {
        display: block;
        position: relative;
        width: 800px;
        margin: 0 auto;
    }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    #paipu-url {
        flex: 1 1 360px;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        outline: none;
        min-width: 260px;
    }
    #paipu-url:focus { border-color: var(--accent); }
    button {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        color: #fff;
        background: var(--accent);
    }
    button.secondary { background: #3d4a6b; }
    button:disabled { opacity: .5; cursor: wait; }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .result { display: none; margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 14px; font-size: 13px; }
    .result.ok .row { color: var(--ok); }
    .result.err .row { color: var(--err); }
    .result .row { margin: 4px 0; word-break: break-all; }
    .result .row b { color: var(--muted); font-weight: 600; margin-right: 6px; }
    #events-summary { margin-top: 14px; font-size: 13px; color: var(--muted); }
    #events-table { display: table; margin-top: 10px; width: 100%; border-collapse: collapse; font-size: 13px; }
    #events-table th, #events-table td {
        padding: 7px 10px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
    }
    #events-table th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    #events-table td.step { color: var(--muted); width: 48px; }
    #events-table td.seat { white-space: nowrap; }
    #events-table td.detail { color: #c6cde0; word-break: break-all; }
    .tag {
        display: inline-block;
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 999px;
        white-space: nowrap;
    }
    .tag-pos { color: var(--ok); background: rgba(62,207,142,.12); }
    .tag-err { color: var(--err); background: rgba(255,107,107,.12); }
    .tag-warn { color: var(--warn); background: rgba(255,180,84,.12); }
    #replay-area {
        margin-top: 8px;
        min-height: 220px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 13px;
    }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>
</head>
<body>

<header>
    <h1>🀄 雀魂牌谱本地复盘系统</h1>
    <span class="badge">阶段四 · majiang-ui 回放对接</span>
</header>

<main>
    <section class="card">
        <h2>输入雀魂牌谱链接</h2>
        <div class="input-row">
            <button id="btn-launch-browser" class="secondary">① 启动调试浏览器</button>

                   placeholder="https://game.maj-soul.com/1/?paipu=200515-cfbe0120-c92c-44ad-bdfc-ebfef3a33a10_a89702544"
                   autocomplete="off">

            <button id="btn-parse">解析</button>
            <button id="btn-demo" class="secondary">查看内置示例</button>
        </div>
        <div class="hint">
            支持普通牌谱与匿名牌谱链接（_a 主视角 / _2 匿名后缀）。<br>
            首次使用：先点「① 启动调试浏览器」并在打开的浏览器中登录雀魂（只需一次）；
            之后粘贴牌谱链接 → 点「② 浏览器拉取」→ 拉取成功后浏览器自动关闭。<br>
            「解析」仅提取对局 ID；「内置示例」无需任何登录，直接演示解码链路。
        </div>

    </section>

    <section class="card">

    <section class="card">

// ---- 事件详情渲染 ----

function describeEvent(e) {
    const d = e.data || {};
    switch (e.type) {
        case "new_round":
            return `场${d.chang ?? 0} 局${d.ju ?? 0} 本场${d.ben ?? 0} · 宝牌指示 ${d.dora || "-"} · 剩余牌山 ${d.left_tile_count ?? "-"}`;
        case "deal_tile":
            return `摸牌 ${d.tile ?? "-"} · 剩余 ${d.left_tile_count ?? "-"}`;
        case "discard_tile":
            const liqi = d.is_liqi ? " 🎋立直" : (d.is_wliqi ? " 🎋双立直" : "");
            return `打牌 ${d.tile ?? "-"}${liqi}`;
        case "chi_peng_gang": {
            const names = {0: "吃", 1: "碰", 2: "明杠", 3: "加杠"};
            return `${names[d.type] ?? "鸣牌"} ${(d.tiles || []).join(" ")} 来自${(d.froms || []).join(",")}`;
        }
        case "an_gang_add_gang":
            return `暗杠/加杠 ${d.tiles ?? "-"}`;
        case "ba_bei":
            return `拔北`;
        case "gang_result":
            return `杠结果`;
        case "hu": {
            const hules = d.hules || [];
            const parts = hules.map(h =>
                `座位${SEAT_NAME[h.seat] ?? h.seat} ${h.zimo ? "自摸" : "荣和"} ${h.hu_tile || ""} 役${h.count ?? "-"}`
            );
            return parts.join("；") || "和牌";
        }
        case "liu_ju":
            return `流局（type=${d.type ?? "-"}）`;
        case "no_tile":
            return `无牌可摸（流局）`;
        default:
            return JSON.stringify(d);
    }
}

function renderEvents(res) {
    evSummary.textContent = `对局 ${res.uuid} · 数据版本 ${res.version} · 共 ${res.event_count} 个事件`;
    evBody.innerHTML = "";
    for (const e of res.events) {
        const tr = document.createElement("tr");
        const seatText = e.seat != null ? SEAT_NAME[e.seat] ?? e.seat : "-";
        const typeText = e.type.replace(/_/g, " ");
        tr.innerHTML =
            `<td class="step">${e.step}</td>` +
            `<td><span class="tag tag-pos">${typeText}</span></td>` +
            `<td class="seat">${seatText}</td>` +
            `<td class="detail">${describeEvent(e)}</td>`;
        evBody.appendChild(tr);
    }
    evScroll.style.display = "block";
    evSummary.style.display = "block";
    btnToggleEvents.style.display = "inline-block";
    btnToggleEvents.textContent = "收起事件流";
    loadReplay(res.uuid);
}

let replayView = null;

function renderReplay(paipu) {
    const area = document.getElementById("replay-area");
    area.innerHTML = replayTemplate();
    const root = document.getElementById("board");

    // 牌模板容器：majiang-ui 的 pai() 需要从 .pai 元素建立牌面映射
    const paiBox = document.createElement("div");
    paiBox.id = "pai";
    paiBox.style.display = "none";
    for (const s of ["m", "p", "s"]) {
        for (let n = 0; n <= 9; n++) {
            const img = document.createElement("img");
            img.className = "pai";
            img.dataset.pai = s + n;
            img.src = `/static/majiang-ui/dist/img/${s}${n}.gif`;
            paiBox.appendChild(img);
        }
    }
    for (let n = 1; n <= 7; n++) {
        const img = document.createElement("img");
        img.className = "pai";
        img.dataset.pai = "z" + n;
        img.src = `/static/majiang-ui/dist/img/z${n}.gif`;
        paiBox.appendChild(img);
    }
    root.appendChild(paiBox);

    // 音频模板容器：majiang-ui 的 audio() 需要从 <audio data-name> 建立音效映射
    const audioBox = document.createElement("div");
    audioBox.id = "audio";
    audioBox.style.display = "none";
    const audioMap = {
        dapai: "dahai11.wav", chi: "chii.wav", peng: "pon.wav",
        gang: "kan.wav", rong: "ron.wav", zimo: "tsumo.wav",
        lizhi: "richi.wav", gong: "beep.wav",
    };
    for (const [name, file] of Object.entries(audioMap)) {
        const a = document.createElement("audio");
        a.dataset.name = name;
        a.src = `/static/majiang-ui/dist/audio/${file}`;
        audioBox.appendChild(a);
    }
    root.appendChild(audioBox);

    // 直接按牌名生成牌面/音效，避免依赖 #pai/#audio 容器的动态映射
    const pai = function(p) {
        let key = p.slice(0, 2);
        // 兼容雀魂格式 "2m" 与 majiang-ui 格式 "m2"
        if (/^[0-9]/.test(key)) key = key[1] + key[0];
        // 牌背 "_"：使用牌背图
        if (key === "_") {
            return $("<img>")
                .attr("class", "pai")
                .attr("data-pai", "_")
                .attr("src", "/static/majiang-ui/dist/img/pai.gif");
        }
        return $("<img>")
            .attr("class", "pai")
            .attr("data-pai", key)
            .attr("src", `/static/majiang-ui/dist/img/${key}.gif`);
    };
    const audio = function(name) {
        const file = audioMap[name] || "beep.wav";
        return new Audio(`/static/majiang-ui/dist/audio/${file}`);
    };
    // analyzer 最小桩：页面暂未接入 AI 复盘面板，但避免点击 i 按钮时报错
    const analyzerStub = {
        active() {}, clear() {}, close() {}, next() {}, action() {}, id() {},
    };
    // Paipu 的 root 需要是 jQuery 对象（内部使用 .on/.off 等 jQuery 方法）
    replayView = new Majiang.UI.Paipu(
        $(root), paipu, pai, audio, "paipu-pref", () => {}, () => analyzerStub
    );
    // 直接定位到第一局起始，避免默认显示空白 kaiju 界面
    replayView.start(0, 0, 0);
}

async function loadReplay(uuid) {
    const area = document.getElementById("replay-area");
    area.innerHTML = '<div style="color:var(--muted)">正在加载回放数据…</div>';
    try {
        const res = await fetch(`/api/v1/paipu/${encodeURIComponent(uuid)}/replay`);
        const data = await res.json();
        if (!res.ok) {
            area.innerHTML = `<div style="color:var(--err)">回放数据加载失败：${data.detail || res.status}</div>`;
            return;
        }
        renderReplay(data.paipu);
    } catch (e) {
        area.innerHTML = `<div style="color:var(--err)">回放加载异常：${e}</div>`;
    }
}

// ---- 交互 ----

function showResult(ok, lines) {
    box.className = "result " + (ok ? "ok" : "err");
    box.style.display = "block";
    box.innerHTML = lines.map(l => `<div class="row"><b>${l[0]}</b>${l[1]}</div>`).join("");
}

function setBusy(busy) {
    btnLaunchBrowser.disabled = btnParse.disabled = btnBrowserFetch.disabled = btnDemo.disabled = busy;
}

async function postJSON(path, body) {
    const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
    });
    return { status: res.status, data: await res.json() };
}

btnLaunchBrowser.addEventListener("click", async () => {
    btnLaunchBrowser.disabled = true;
    try {
        const res = await fetch("/api/v1/browser/launch", { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
            showResult(false, [["失败", data.detail || "浏览器启动失败"]]);
            return;
        }
        showResult(true, [
            ["已启动", data.browser],
            ["提示", "在打开的浏览器中登录雀魂（首次需登录一次），然后粘贴牌谱链接点「② 浏览器拉取」"],
        ]);
    } catch (e) {
        showResult(false, [["错误", String(e)]]);
    } finally {
        btnLaunchBrowser.disabled = false;
    }
});

btnParse.addEventListener("click", async () => {
    const url = input.value.trim();
    if (!url) { showResult(false, [["提示", "请先粘贴雀魂牌谱链接"]]); return; }
    setBusy(true);
    try {
        const { status, data } = await postJSON("/api/v1/paipu/parse", { url });
        if (status !== 200) {
            showResult(false, [["错误", data.detail || "解析失败"]]);
            return;
        }
        showResult(true, [
            ["对局 ID", data.uuid],
            ["主视角", data.match_id || "（默认）"],
            ["类型", data.anonymous ? "匿名牌谱" : "普通牌谱"],
            ["对局日期", data.date || "（匿名链接无法识别）"],
        ]);
    } catch (e) {
        showResult(false, [["错误", String(e)]]);
    } finally {
        setBusy(false);
    }
});

btnBrowserFetch.addEventListener("click", async () => {
    const url = input.value.trim();
    if (!url) { showResult(false, [["提示", "请先粘贴雀魂牌谱链接"]]); return; }
    setBusy(true);
    showResult(true, [["进行中", "正在通过调试浏览器打开牌谱并捕获数据（Unity 加载约需 10-60s）…"]]);
    try {
        const { status, data } = await postJSON("/api/v1/paipu/browser-fetch", { url });
        if (status !== 200) {
            showResult(false, [["拉取失败", data.detail || "未知错误"]]);
            evSummary.textContent = "拉取失败，无事件数据。";
            return;
        }
        showResult(true, [
            ["拉取成功", `对局 ${data.uuid}，解码出 ${data.event_count} 个事件`],
            ["浏览器", "已自动关闭（下次拉取时点「① 启动调试浏览器」即可）"],
        ]);
        renderEvents(data);
    } catch (e) {
        showResult(false, [["错误", String(e)]]);
    } finally {
        setBusy(false);
    }
});

btnDemo.addEventListener("click", async () => {
    setBusy(true);
    try {
        const res = await fetch("/api/v1/paipu/demo");
        const data = await res.json();
        if (!res.ok) {
            showResult(false, [["错误", data.detail || "演示数据加载失败"]]);
            return;
        }
        showResult(true, [["演示", "内置真实牌谱样例（无需 token）"], ["事件数", String(data.event_count)]]);
        renderEvents(data);
    } catch (e) {
        showResult(false, [["错误", String(e)]]);
    } finally {
        setBusy(false);
    }
});

btnToggleEvents.addEventListener("click", () => {
    const collapsed = evScroll.style.display === "none";
    if (collapsed) {
        evScroll.style.display = "block";
        evSummary.style.display = "block";
        btnToggleEvents.textContent = "收起事件流";
    } else {
        evScroll.style.display = "none";
        evSummary.style.display = "none";
        btnToggleEvents.textContent = "展开事件流";
        document.getElementById("replay-area").scrollIntoView({ behavior: "smooth", block: "start" });
    }
});

input.addEventListener("keydown", e => { if (e.key === "Enter") btnParse.click(); });
</script>
</body>
</html>
